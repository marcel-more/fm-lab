openapi: 3.0.3
info:
  title: FM-Lab REST API
  description: REST API for programmatic access to FileMaker metadata stored in DuckDB
  version: 1.0.0
  contact:
    name: Marcel
  license:
    name: ISC

servers:
  - url: http://localhost:3003
    description: Local development server

tags:
  - name: Objects
    description: Object retrieval and listing
  - name: Search
    description: Object search and counting
  - name: References
    description: Object references and dependencies
  - name: Templates
    description: SQL template execution
  - name: System
    description: System information and health
  - name: Favorites
    description: Workspace-wide favorites of the web client
  - name: Maintenance
    description: Workspace housekeeping, independent of the selected solution
  - name: Reference
    description: >-
      fm-spec language reference (schema viewer backend). Only the grammar
      endpoint is specified so far — the remaining /reference/* endpoints are
      a known documentation gap from the REST docs round.

paths:
  /version:
    get:
      summary: Get API version and health status
      tags: [System]
      responses:
        '200':
          description: API version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /info:
    get:
      summary: Get solution information
      tags: [System]
      parameters:
        - $ref: '#/components/parameters/FileFilter'
      responses:
        '200':
          description: Solution metadata and statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'

  /get:
    get:
      summary: Get object by UUID
      tags: [Objects]
      parameters:
        - name: uuid
          in: query
          required: true
          schema:
            type: string
          description: Object UUID
        - $ref: '#/components/parameters/CloneFile'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Debug'
        - $ref: '#/components/parameters/Meta'
        - $ref: '#/components/parameters/UiLang'
      responses:
        '200':
          description: Object details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /list:
    get:
      summary: List objects by type
      tags: [Objects]
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ObjectType'
          description: Object type to list
        - $ref: '#/components/parameters/FileFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Debug'
        - $ref: '#/components/parameters/Meta'
        - $ref: '#/components/parameters/UiLang'
      responses:
        '200':
          description: List of objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectListResponse'

  /search:
    get:
      summary: Search objects by name
      tags: [Search]
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: |
            Name pattern (SQL LIKE, e.g. %Import%). Also matches an object by its
            identity, but only as the WHOLE term (one outer `%…%` wrapper is
            ignored, any inner `%` disables identity matching):
            - a FileMaker UUID (`8-4-4-4-12`, case-insensitive; `{…}`, quotes and
              `urn:uuid:` are tolerated) or a synthetic 32-hex fm-lab UUID,
            - a composite import key (`part_…`, `trig_…`, `paste_…`; `rel_…` only for
              a relationship from an export without `<UUID>` — relationships
              otherwise match by their FileMaker UUID),
            - `id:<n>` — the numeric FileMaker ID, which is unique only per file.
              Without `type` it searches the per-file-unique types; with `type`
              also `field` (unique per table), `builtinfunction` (Function-ID) and
              `scriptsteptype` (Step-ID). `id:<n>` runs no name search.
            Identity hits come first and carry `Match_Kind`.
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ObjectType'
        - $ref: '#/components/parameters/FileFilter'
        - name: sort
          in: query
          schema:
            type: string
            enum: [modified]
          description: |
            `modified` — order by the object's own change stamp, newest first;
            objects without a stamp of their own (script steps, layout objects,
            built-ins, …) come last. Results then carry `Modified_At`. Without
            `sort` the result order is unchanged.
        - $ref: '#/components/parameters/ModifiedSince'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Debug'
        - $ref: '#/components/parameters/Meta'
        - $ref: '#/components/parameters/UiLang'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectListResponse'

  /search/count:
    get:
      summary: Count search results by name pattern
      tags: [Search]
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Name pattern — same semantics as `/search`, including identity matching
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ObjectType'
        - $ref: '#/components/parameters/FileFilter'
        - $ref: '#/components/parameters/ModifiedSince'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Debug'
        - $ref: '#/components/parameters/Meta'
      responses:
        '200':
          description: Search result count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'

  /count:
    get:
      summary: Count objects
      tags: [Search]
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ObjectType'
        - $ref: '#/components/parameters/FileFilter'
        - name: group_by
          in: query
          schema:
            type: string
            enum: [type, file, 'type,file']
          description: Group results by field
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Debug'
        - $ref: '#/components/parameters/Meta'
      responses:
        '200':
          description: Object counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'

  /references:
    get:
      summary: Get object references
      tags: [References]
      parameters:
        - name: uuid
          in: query
          required: true
          schema:
            type: string
          description: Object UUID
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/ReferenceDirection'
          default: all
        - name: link_type
          in: query
          schema:
            $ref: '#/components/schemas/LinkType'
          default: operational
        - name: origin
          in: query
          required: false
          schema:
            type: string
          description: >-
            Origin object UUID (the `?ref=` cross-reference origin). For pseudo
            aggregate types (ScriptStepType) it flags the rows reachable from
            that origin via `Origin_Hit`, so the UI can pin/highlight them.
        - $ref: '#/components/parameters/CloneFile'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Debug'
        - $ref: '#/components/parameters/Meta'
      responses:
        '200':
          description: Object references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferencesResponse'

  /references/candidates:
    get:
      summary: Get reference candidates (types this object could reference but does not)
      description: >-
        Evaluates the curated candidate matrix for one focus object. A candidate is
        a direction (`in` = incoming, `out` = outgoing), a group of counterpart
        types answering the same question, and a set of link roles. It is met as
        soon as one edge in that direction connects the focus with a type of the
        group through one of the roles — role-exact, not type-exact. For layouts
        the outgoing candidates also evaluate the layout's own layout objects
        (status `indirect`). Candidates are gated by the focus subtype
        (LayoutObject control type, variable scope) and dropped when none of
        their counterpart types exists in the solution (`meta.suppressed`).
        "Missing" always means "no statically resolvable reference", never
        "unused".
      tags: [References]
      parameters:
        - name: uuid
          in: query
          required: true
          schema:
            type: string
          description: Object UUID
        - $ref: '#/components/parameters/CloneFile'
      responses:
        '200':
          description: Candidate statuses of the focus object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceCandidatesResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /query:
    get:
      summary: Execute custom SQL template
      tags: [Templates]
      parameters:
        - name: template
          in: query
          required: true
          schema:
            type: string
          description: Template name (without .sql extension)
        - name: params
          in: query
          schema:
            type: object
            additionalProperties: true
          description: Template parameters as JSON
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Debug'
        - $ref: '#/components/parameters/Meta'
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '404':
          $ref: '#/components/responses/TemplateNotFound'
    post:
      summary: Execute custom SQL template (POST)
      tags: [Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'

  /report:
    get:
      summary: Execute report template
      tags: [Templates]
      parameters:
        - name: template
          in: query
          required: true
          schema:
            type: string
        - name: params
          in: query
          schema:
            type: object
            additionalProperties: true
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Debug'
        - $ref: '#/components/parameters/Meta'
      responses:
        '200':
          description: Report results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
    post:
      summary: Execute report template (POST)
      tags: [Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Report results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'

  /tests:
    get:
      summary: List Analysis Tests (declared collections of dashboards/custom queries)
      tags: [Templates]
      parameters:
        - name: objectType
          in: query
          schema:
            type: string
          description: Only tests applicable to this ObjectCatalog.Object_Type
        - name: testType
          in: query
          schema:
            type: string
            enum: [exploration, code-quality, error-check, security, inventory, performance, platform]
        - name: scope
          in: query
          schema:
            type: string
            enum: [solution, file, object, object-list, cluster]
          description: Only tests declaring this scope
        - name: keyword
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
          description: Text search over title, description and keywords
        - name: folder
          in: query
          schema:
            type: string
      responses:
        '200':
          description: >-
            Test list incl. tier, override flag, validation status, shipped
            profiles and folder_order (sorted by folder.json order, then
            folder, then title). Each profile carries `memberCount` plus
            `members` — the member refs it covers, `null` for a profile
            without a `members` field (= the full check).

  /tests/context:
    get:
      summary: Effective solution + catalog fingerprint (result-cache key)
      description: >-
        Lightweight cache-key endpoint. `catalogFingerprint` is mtime+size of
        the solution's read copy — a new XML import replaces the copy
        atomically and thereby invalidates client-side result caches.
      tags: [Templates]
      responses:
        '200':
          description: '{ solution, catalogFingerprint, catalogMtimeMs }'

  /tests/{id}:
    get:
      summary: Test definition with resolved members and validation report
      tags: [Templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >-
            Test definition with members resolved against their source of
            truth (title, icon, severity, analysis block, plus the dashboard's
            `folder` resp. the query's `category`) and shipped profiles incl.
            their `members` refs
        '404':
          description: Test not found or invalid

  /tests/{id}/run:
    get:
      summary: Run all members' default results in a scope context
      description: >-
        Scope params: `uuid` (+`file` for clone disambiguation) = object scope,
        `uuids` (CSV) = object-list scope, `file` alone = file scope,
        `cluster` (community id or semantic name) = cluster scope, none =
        solution scope. `include=findings` adds severity-sorted findings rows
        (capped by `findingsLimit`, default 20) per member with value > 0.
        `profile=<id>` runs only that shipped profile's members; the rest are
        reported as runStatus=skipped (unknown profile id = 400).
        Each member result carries the two-axis state model: `runStatus`
        (ran|failed|skipped) and `resultState` (error|warning|neutral|ok);
        the response aggregates them in `summary` and echoes `solution` +
        `catalogFingerprint` in `meta`. The legacy `status` field (ok|error)
        is kept as a deprecated alias of runStatus ran|failed.
      tags: [Templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: uuid
          in: query
          schema:
            type: string
        - name: uuids
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/FileFilter'
        - name: cluster
          in: query
          schema:
            type: string
        - name: object_type
          in: query
          schema:
            type: string
        - name: include
          in: query
          schema:
            type: string
            enum: [findings]
        - name: findingsLimit
          in: query
          schema:
            type: integer
        - name: profile
          in: query
          schema:
            type: string
          description: Shipped profile id — run only this member subset
      responses:
        '200':
          description: Per-member default results (and optional findings)
        '400':
          description: Unsupported scope, oversized scope list or consistency errors

  /tests/{id}/run/{memberIndex}:
    get:
      summary: Run a single member of a test (incremental loading)
      tags: [Templates]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: memberIndex
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Single member result

  /results/summary:
    get:
      summary: Flat Result-Envelope map over all result-capable units (cache read)
      description: >-
        Result Envelope v1 — one normative result shape per unit
        (`kind:id`, kind ∈ dashboard | query | test). Reads ONLY the server
        result cache: units that never ran under the current
        `catalogFingerprint` appear with `runStatus: pending`; the endpoint
        computes nothing. Runs are triggered explicitly via POST /results/run
        (or arrive as write-through from solution-scope test runs).
      tags: [Results]
      parameters:
        - name: kinds
          in: query
          schema:
            type: string
          description: CSV filter over ref kinds (dashboard,query,test)
      responses:
        '200':
          description: >-
            { meta: { solution, catalogFingerprint }, results: { "<kind:id>":
            Envelope } } — Envelope carries runStatus (ran|failed|pending),
            resultState (ok|warning|error|neutral), value, unit, name,
            meaning, severity, source, rubric, fingerprint

  /results/aggregate:
    get:
      summary: Folder-hierarchy consolidation of the cached envelopes
      description: >-
        Pure fold over registry + cache — never executes anything. Per node:
        counts per state + worst (error → warning → failed → neutral → ok →
        pending), sums only within the same `unit`, and covered/declared/total
        so partial coverage stays visible.
      tags: [Results]
      parameters:
        - name: root
          in: query
          schema:
            type: string
          description: Subtree root folder path (empty = whole hierarchy)
        - name: roots
          in: query
          schema:
            type: string
          description: >-
            Comma-separated list of subtree roots. Scopes to several subtrees
            at once; the '' node is then the combined aggregate over all of
            them. Wins over `root` when both are set.
        - name: kinds
          in: query
          schema:
            type: string
      responses:
        '200':
          description: '{ meta, nodes: [{ path, counts, worst, sums, covered, declared, total }] }'

  /results/registry:
    get:
      summary: Result-capable units (declaration union of the existing catalogs)
      description: >-
        Dashboards with `analysis.defaultResult` or the summary/finding_count
        convention, queries with `@default_result` frontmatter, tests (read-
        only). Units without declaration are absent by design and stay
        chipless.
      tags: [Results]
      parameters:
        - name: kinds
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Registry rows (ref, rubric, title, severity, unit, source)

  /results/run:
    post:
      summary: Explicit result run for singles or folder subtrees
      description: >-
        Body { targets, mode }. Targets are { kind, id } singles or
        { kind: "folder", path, kinds } subtrees (expanded via the registry;
        only dashboard/query run — tests keep their own run endpoint).
        mode "missing" (default) runs only units without a cached envelope
        under the current fingerprint (idempotent); "refresh" re-runs all
        addressed units. Synchronous with a concurrency cap — chunk a full
        root run per top-level folder.
      tags: [Results]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targets:
                  type: array
                  items:
                    type: object
                mode:
                  type: string
                  enum: [missing, refresh]
      responses:
        '200':
          description: '{ meta: { …, requested, executed, skippedCached }, results: Envelope[] }'
        '400':
          description: Invalid targets/mode or oversized expansion

  /favorites/{kind}:
    parameters:
      - $ref: '#/components/parameters/FavoriteKind'
    get:
      summary: Favorites of one kind (dashboards or tests) of the workspace
      description: >-
        Workspace-wide favorites from `.fmlab/favorites.json`, independent of
        the selected solution (the X-Solution header plays no role).
        `items` are the available favorites in the order they were added;
        `missing` lists stored ids that no longer resolve — a dashboard the
        discovery no longer knows or whose area can no longer be favorited, a
        test that no longer exists. Read-only — missing ids are never removed
        automatically.
      tags: [Favorites]
      responses:
        '200':
          description: Favorites split into available items and missing ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Favorites'
        '400':
          description: Unknown kind (VALIDATION_ERROR)

  /favorites/{kind}/{id}:
    parameters:
      - $ref: '#/components/parameters/FavoriteKind'
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
        description: Dashboard id (bundle or single-file unit) resp. test id
    put:
      summary: Add a dashboard or test to the favorites (idempotent)
      description: >-
        Dashboards can be favorited in the content areas (builtin, custom,
        community); tests in every area. Adding an existing favorite keeps its
        `added_at`.
      tags: [Favorites]
      responses:
        '200':
          description: Current favorites of the kind after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Favorites'
        '400':
          description: Unknown kind or invalid id (VALIDATION_ERROR)
        '404':
          description: Unknown dashboard or test (TEMPLATE_NOT_FOUND)
        '422':
          description: System or module page that cannot be favorited (NOT_FAVORITABLE, dashboards only)
    delete:
      summary: Remove a dashboard or test from the favorites (idempotent)
      description: >-
        Succeeds without an entry as well. Only the id pattern is checked, so
        a favorite whose dashboard or test is gone stays removable.
      tags: [Favorites]
      responses:
        '200':
          description: Current favorites of the kind after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Favorites'
        '400':
          description: Unknown kind or invalid id (VALIDATION_ERROR)

  /maintenance/dashboards/cleanup:
    get:
      summary: Check for dashboards and queries left over from an older layout
      description: >-
        Read-only. Compares `rest-api/templates/dashboards/`,
        `rest-api/templates/dashboards-custom/` and the old query locations
        `sql-custom/`, `sql/`, `sql-custom-details/` with the shipped
        inventories (`dashboards/inventory.json`, `queries/inventory.json`)
        and lists what a cleanup would move: old copies of shipped bundles and
        queries and emptied old folders to `dashboards-removed/<timestamp>/`,
        own bundles and own queries to `dashboards-custom/` (own queries from
        the old locations flat as `<name>.sql`). Independent of the selected
        solution. Without a usable dashboard inventory nothing is classified
        (`inventory: false`).
      tags: [Maintenance]
      responses:
        '200':
          description: Planned moves (empty on a clean installation)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TemplateCleanupPreview'
    post:
      summary: Move the leftover dashboards and queries
      description: >-
        Classifies anew (the client list is never taken over), leaves the
        entries named in `exclude` in place, checks every source and target
        before the first move and writes `cleanup.json` into the run folder
        `dashboards-removed/<timestamp>/`. Nothing is deleted. Requires the
        `X-Admin-Token` header when `ADMIN_RELOAD_TOKEN` is set.
      tags: [Maintenance]
      parameters:
        - name: X-Admin-Token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                exclude:
                  type: array
                  description: '`from` values of the preview to leave in place'
                  items:
                    type: string
                  example: ['dashboards-custom/static-code-analysis/unused_code/unused_layout']
      responses:
        '200':
          description: Report of the run
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TemplateCleanupReport'
        '400':
          description: '`exclude` is not an array of strings (VALIDATION_ERROR)'
        '401':
          description: Missing or wrong X-Admin-Token (UNAUTHORIZED)
        '409':
          description: Another dashboard cleanup run is active (CLEANUP_RUNNING)

  /maintenance/tests/cleanup:
    get:
      summary: Check for Analysis Tests left over from an older layout
      description: >-
        Read-only. Compares `rest-api/templates/tests/` with the shipped
        inventory (`tests/inventory.json`) and lists what a cleanup would
        move: shipped tests away from their path and folders without a test to
        `tests-removed/<timestamp>/`, own tests to `tests-custom/`.
        `tests-custom/` and `tests-community/` are never touched.
        Independent of the selected solution. Without a usable inventory
        nothing is classified (`inventory: false`).
      tags: [Maintenance]
      responses:
        '200':
          description: Planned moves (empty on a clean installation)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TemplateCleanupPreview'
    post:
      summary: Move the leftover Analysis Tests
      description: >-
        Same procedure as the dashboard cleanup, with its own lock: classifies
        anew, leaves the entries named in `exclude` in place, checks every
        source and target first and writes `cleanup.json` into
        `tests-removed/<timestamp>/`. Nothing is deleted. Requires the
        `X-Admin-Token` header when `ADMIN_RELOAD_TOKEN` is set.
      tags: [Maintenance]
      parameters:
        - name: X-Admin-Token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                exclude:
                  type: array
                  description: '`from` values of the preview to leave in place'
                  items:
                    type: string
                  example: ['tests/script/my-test']
      responses:
        '200':
          description: Report of the run
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TemplateCleanupReport'
        '400':
          description: '`exclude` is not an array of strings (VALIDATION_ERROR)'
        '401':
          description: Missing or wrong X-Admin-Token (UNAUTHORIZED)
        '409':
          description: Another test cleanup run is active (CLEANUP_RUNNING)

  /reference/steps/{idOrSlug}/grammar:
    get:
      summary: XMLSnippet grammar of one script step (fm-spec emission layer)
      description: >-
        Snippet template, element order, options (with per-value evidence),
        structural constraints incl. the known-FM-bug registry kinds
        (clipboard_loss, version_skew, save_corruption,
        serialization_unstable, localized_build_defect — a warning class,
        never a validity rule), repeat groups (fm_spec >= 1.15.0;
        fixed-slot columns max_items/slot_positional/pad_mode >= 1.16.0),
        and the hint-inventory layer (fm_spec >= 1.17.0): skeleton hulls,
        option-bound elements, notation implications, the structural
        variable-target marker and the per-kind consumer note of the
        bug registry. Fields absent from older reference builds are
        null/empty — consumers must stay graceful.
      tags: [Reference]
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema:
            type: string
          description: Numeric step id or url_slug
      responses:
        '200':
          description: Step grammar (data envelope)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      stepId:
                        type: integer
                      canonicalName:
                        type: string
                      available:
                        type: boolean
                        description: false when the reference has no grammar row
                      xmlMap:
                        type: object
                        nullable: true
                        properties:
                          snippetTemplate: { type: string }
                          saxmlParamTypes: { type: string, nullable: true }
                          saxmlExample: { type: string, nullable: true }
                          elementOrder: { type: string, nullable: true }
                          variableTargetMarker:
                            type: boolean
                            nullable: true
                            description: >-
                              true = the snippet carries an empty <Text/>
                              step-level marker exactly when a target slot
                              holds a variable (fm_spec >= 1.17.0; null =
                              column absent on this reference build)
                          evidence: { type: string, nullable: true }
                          verifiedVersion: { type: string, nullable: true }
                          notes: { type: string, nullable: true }
                      options:
                        type: array
                        items:
                          type: object
                          properties:
                            optionKey: { type: string }
                            optionType: { type: string }
                            required: { type: boolean }
                            displayLocation: { type: string, nullable: true }
                            displayLabelEn: { type: string, nullable: true }
                            trueText: { type: string, nullable: true }
                            falseText: { type: string, nullable: true }
                            omitWhenFalse: { type: boolean }
                            invertedLabel: { type: boolean }
                            xmlPath: { type: string, nullable: true }
                            sortOrder: { type: integer, nullable: true }
                            evidence: { type: string, nullable: true }
                            verifiedVersion: { type: string, nullable: true }
                            values:
                              type: array
                              items:
                                type: object
                                properties:
                                  xmlValue: { type: string }
                                  displayTextEn: { type: string, nullable: true }
                                  evidence: { type: string, nullable: true }
                      constraints:
                        type: array
                        items:
                          type: object
                          properties:
                            constraintKind: { type: string }
                            detail: { type: string, nullable: true }
                            evidence: { type: string, nullable: true }
                            verifiedVersion: { type: string, nullable: true }
                            consumerNote:
                              type: string
                              nullable: true
                              description: >-
                                Consumer-facing lead text of the constraint
                                kind (fm_spec >= 1.17.0 constraint_kinds
                                registry; bug-registry kinds only)
                      repeatGroups:
                        type: array
                        description: Empty on references older than 1.15.0
                        items:
                          type: object
                          properties:
                            groupKey: { type: string }
                            groupLabel: { type: string }
                            parentGroup: { type: string, nullable: true }
                            containerPath: { type: string }
                            countAttr: { type: string, nullable: true }
                            itemForm:
                              type: string
                              enum: [bracket, scalar]
                            maxItems: { type: integer, nullable: true }
                            slotPositional: { type: boolean, nullable: true }
                            padMode: { type: string, nullable: true }
                            evidence: { type: string, nullable: true }
                            verifiedVersion: { type: string, nullable: true }
                      skeletonElements:
                        type: array
                        description: >-
                          Skeleton hulls the step keeps alive even
                          unconfigured (fm_spec >= 1.17.0; empty on older
                          references)
                        items:
                          type: object
                          properties:
                            parentTag: { type: string }
                            childTag: { type: string }
                            conditionOption: { type: string, nullable: true }
                            conditionValue: { type: string, nullable: true }
                            keepMode:
                              type: string
                              enum: [hull, hull_strip_children]
                            evidence: { type: string, nullable: true }
                            verifiedVersion: { type: string, nullable: true }
                      elementBindings:
                        type: array
                        description: >-
                          Option-value/element couplings (fm_spec >= 1.17.0;
                          empty on older references)
                        items:
                          type: object
                          properties:
                            optionKey: { type: string, nullable: true }
                            optionValue: { type: string, nullable: true }
                            elementPath: { type: string }
                            binding:
                              type: string
                              enum: [requires, excludes, requires_option,
                                     excludes_option, suppress_empty]
                            evidence: { type: string, nullable: true }
                            verifiedVersion: { type: string, nullable: true }
                      optionImplications:
                        type: array
                        description: >-
                          Parse-side notation implications (fm_spec >= 1.17.0;
                          empty on older references)
                        items:
                          type: object
                          properties:
                            triggerKind:
                              type: string
                              enum: [option_present, value_form, keyword,
                                     mode_switch]
                            trigger: { type: string }
                            impliedOption: { type: string }
                            impliedValue: { type: string, nullable: true }
                            isDefault: { type: boolean, nullable: true }
                            direction:
                              type: string
                              enum: [parse]
                            evidence: { type: string, nullable: true }
                            verifiedVersion: { type: string, nullable: true }
        '404':
          description: Unknown step id/slug (REF_STEP_NOT_FOUND)

components:
  parameters:
    FavoriteKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [dashboard, test]
      description: Kind of favorite — dashboard (bundle or single-file unit) or Analysis Test

    FileFilter:
      name: file
      in: query
      schema:
        type: string
      description: Filter by filename

    ModifiedSince:
      name: modified_since
      in: query
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
      description: |
        Keep only objects whose own change stamp is on or after this day
        (`YYYY-MM-DD`, local time of the editing client). Objects without a stamp
        of their own drop out. Results then carry `Modified_At`.

    CloneFile:
      name: file
      in: query
      schema:
        type: string
      description: >-
        Clone disambiguation: exact source file (File_Name) of the object.
        Geklonte/modulare FileMaker-Dateien teilen sich dieselbe Object_UUID,
        d.h. eine bare UUID kann mehrdeutig sein. Mit `file` wird das Paar
        (UUID, File_Name) eindeutig aufgelöst. Fehlt der Param, gilt Graceful
        Downgrade (bare UUID, solange eindeutig; sonst 409 AMBIGUOUS_UUID).

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 100
      description: Maximum number of results (0 = all)

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of results to skip (for pagination)

    Format:
      name: format
      in: query
      schema:
        $ref: '#/components/schemas/OutputFormat'
      default: json
      description: Output format

    Debug:
      name: debug
      in: query
      schema:
        type: boolean
        default: false
      description: Include SQL query in response

    Meta:
      name: meta
      in: query
      schema:
        type: boolean
        default: false
      description: Include metadata in response

    UiLang:
      name: lang
      in: query
      schema:
        type: string
      description: >-
        Active UI language. BuiltinFunction rows additionally carry
        `Localized_Name` — the localized spelling next to the canonical
        reference name, which is what the catalog stores as their identity.
        Other object types ignore the parameter.

  schemas:
    ObjectType:
      type: string
      enum:
        - BaseTable
        - TableOccurrence
        - Relationship
        - Field
        - ValueList
        - CustomFunction
        - Script
        - ScriptStep
        - Layout
        - LayoutObject
        - LayoutPart
        - Account
        - PrivilegeSet
        - ExtendedPrivilege
        - Theme
        - CustomMenu
        - ScriptTrigger
        - ExternalDataSource
        - BaseDirectory
        - Variable
        - Folder
        - File
        - PluginFunction
        - PluginComponent
        - CustomMenuItem
        - BuiltinFunction
        - ScriptStepType
        - PasteIndexObject
        # Calculation instance (owner × role × index), schema 1.22.0
        - Calculation

    OutputFormat:
      type: string
      enum:
        - json
        - raw
        - text
        - short
        - detailed
        - html
        - markdown
        - content
        - mermaid
        - mermaid-raw

    LinkType:
      type: string
      enum:
        - operational
        - structural
        - all

    ReferenceDirection:
      type: string
      enum:
        - all
        - parent
        - child
        - recursive

    FMObject:
      type: object
      required:
        - Object_UUID
        - Object_Type
        - Object_Name
        - File_Name
      properties:
        Object_UUID:
          type: string
          description: Unique object identifier
        Object_Type:
          $ref: '#/components/schemas/ObjectType'
        Object_Name:
          type: string
          description: Object name
        File_Name:
          type: string
          description: Source FileMaker file
        Source_Table:
          type: string
          description: Source database table
        Object_ID:
          type: integer
          description: Internal FileMaker ID
        Step_Text:
          type: string
          nullable: true
          description: |
            Full rendered text of a script step (ScriptStep results only).
            Combines DDR_ScriptSteps.Step_Text (FileMaker 21+ DDR_INFO) with
            a fallback that extracts comment values from Parameters_XML.
            Used by full-text search on script-step contents and by the
            search-result UI to display the step in its rendered form.
        Script_Name:
          type: string
          nullable: true
          description: |
            Name of the script containing this step (ScriptStep results only).
            Used to render the "File ▸ Script ▸ Step N" breadcrumb context.
        Step_Index:
          type: integer
          nullable: true
          description: |
            Zero-based position of the step within its script (ScriptStep
            results only). The UI displays it 1-based to match FileMaker's
            script editor numbering.
        Modified_At:
          type: string
          nullable: true
          description: |
            Own change stamp of the object (`YYYY-MM-DD HH:MM:SS`, local time of
            the editing client, no time zone). Only present when `/search` runs
            with `sort=modified` or `modified_since`; null for objects without a
            stamp of their own.
        Matched_Values:
          type: string
          nullable: true
          description: |
            What matched the search term, when it was not the object's name.
            ValueList: the stored custom values that matched (max. 20).
            BuiltinFunction: the localized spelling(s) that matched — a built-in
            is catalogued under its canonical English name, so a search for
            `Seitennummer` finds `Get(PageNumber)` and this field says why.
            The search-result UI displays it below the object name.
            Identity hits (`Match_Kind` object_id/function_id/step_id): the
            matched numeric ID.
        Match_Kind:
          type: string
          nullable: true
          enum: [uuid, healed_uuid, object_id, function_id, step_id, null]
          description: |
            Set only on search results found by identity rather than by name
            (absent/null for name and full-text hits):
            `uuid` — the term equals the object's UUID or import key;
            `healed_uuid` — the term is the original FileMaker UUID of a
            duplicate that was re-keyed on import (the catalog lists it under a
            replacement UUID); `object_id` / `function_id` / `step_id` — the
            numeric ID given as `id:<n>`.
        Localized_Name:
          type: string
          nullable: true
          description: |
            Localized spelling of a BuiltinFunction in the requested `lang`
            (e.g. `Hole ( Seitennummer )` for `Get(PageNumber)`). Present only
            with `?lang=` and only when it differs from the canonical name,
            which stays the object's identity in `Object_Name`.

    ObjectReference:
      type: object
      properties:
        Target_UUID:
          type: string
        Target_Type:
          $ref: '#/components/schemas/ObjectType'
        Target_Name:
          type: string
        Target_File:
          type: string
        Link_Role:
          type: string
          description: Role of the link (e.g., calls_script, displays_field)
        Subrole_Class:
          type: string
          nullable: true
          description: >-
            Normalized slot class of the edge subrole, using the calc_kind
            vocabulary of CalculationsCatalog (e.g. `hide`,
            `conditional_format`, `tooltip`, `on_server`). Named slots are
            mapped (Condition_N collapses into `conditional_format`),
            positional script-slot indices (and XML/XSL) are suppressed to
            null, unknown subroles pass through raw. Null when the edge
            carries no semantic subrole.
        Subrole_Detail:
          type: string
          nullable: true
          description: >-
            Raw subrole value(s) behind the class — for `direction=all` the
            aggregated DISTINCT raw values of the group (e.g. `Condition_1,
            Condition_2`), in the ungrouped child/parent branches the single
            raw value. Null when Subrole_Class is null (direction=all) or no
            subrole exists.
        Subrole_Event:
          type: string
          nullable: true
          description: >-
            Additive since fm_spec 1.18.0 — canonical trigger event name(s)
            resolved from the `ScriptTrigger_<id>` slot(s) of rows with
            Subrole_Class `script_trigger_parameter` (e.g. `OnObjectValidate`;
            aggregated rows yield a DISTINCT list in Subrole_Detail order,
            e.g. `OnPanelSwitch, OnObjectValidate`). Omitted when the
            reference DB is not attached, predates 1.18.0, or a slot of the
            list cannot be resolved (complete-or-absent contract).
        Is_Cross_File:
          type: boolean

    ResponseMeta:
      type: object
      properties:
        execution_time_ms:
          type: integer
          description: Query execution time in milliseconds
        result_count:
          type: integer
          description: Number of results returned
        query:
          type: string
          description: SQL query (only if debug=true)

    ApiResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ObjectResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FMObject'

    ObjectListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/FMObject'

    CountResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              oneOf:
                - type: object
                  properties:
                    count:
                      type: integer
                - type: array
                  items:
                    type: object
                    properties:
                      Object_Type:
                        $ref: '#/components/schemas/ObjectType'
                      File_Name:
                        type: string
                      count:
                        type: integer

    ReferencesResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                source:
                  $ref: '#/components/schemas/FMObject'
                references:
                  type: object
                  properties:
                    parent:
                      type: array
                      items:
                        $ref: '#/components/schemas/ObjectReference'
                    child:
                      type: array
                      items:
                        $ref: '#/components/schemas/ObjectReference'

    ReferenceCandidate:
      type: object
      required: [direction, types, roles, status, direct, indirect]
      properties:
        direction:
          type: string
          enum: [in, out]
          description: '`in` = incoming (the counterpart references the focus), `out` = outgoing'
        types:
          type: array
          items:
            type: string
          description: Counterpart type group — one hit on any type meets the candidate
        roles:
          type: array
          items:
            type: string
          description: Candidate link roles (verified against LinkRoleRegistry)
        status:
          type: string
          enum: [present, indirect, missing]
          description: >-
            `present` = direct reference with a candidate role; `indirect` = met
            only through aggregate members (a layout's own layout objects);
            `missing` = neither
        direct:
          type: integer
          description: Distinct counterpart objects reached directly
        indirect:
          type: integer
          description: Distinct counterpart objects reached through aggregate members
        aggregate:
          type: boolean
          description: True when the candidate also evaluates the aggregate members (`meta.aggregate`)
        via:
          type: string
          description: Aggregate member type (only when `indirect` > 0)
        caveat:
          type: string
          enum: [scriptCallers, toFieldAccess]
          description: >-
            Known blind spot of the candidate: `scriptCallers` = dynamic calls
            (Perform Script by name, fmp URLs, external calls) are not resolved;
            `toFieldAccess` = field access through a table occurrence creates no
            edge to the occurrence

    ReferenceCandidatesResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ReferenceCandidate'
            meta:
              type: object
              properties:
                focus_type:
                  type: string
                focus_subtype:
                  type: string
                  nullable: true
                  description: LayoutObject control type or variable scope; null when ungated
                aggregate:
                  type: string
                  nullable: true
                  description: Aggregate member type evaluated for outgoing candidates
                aggregate_members:
                  type: integer
                  description: Number of aggregate members (only for aggregating focus types)
                suppressed:
                  type: array
                  items:
                    type: object
                    properties:
                      direction:
                        type: string
                        enum: [in, out]
                      types:
                        type: array
                        items:
                          type: string
                      reason:
                        type: string
                        enum: [subtype, not_in_solution, roles_unregistered]
                execution_time_ms:
                  type: integer

    QueryRequest:
      type: object
      required:
        - template
      properties:
        template:
          type: string
          description: Template name
        params:
          type: object
          additionalProperties: true
          description: Template parameters
        format:
          $ref: '#/components/schemas/OutputFormat'
        debug:
          type: boolean
        meta:
          type: boolean

    QueryResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                additionalProperties: true

    VersionResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                version:
                  type: string
                api_name:
                  type: string
                duckdb_version:
                  type: string
                  nullable: true
                  description: DuckDB bundled with the REST API (@duckdb/node-api) — reads the catalogs
                duckdb_cli:
                  type: object
                  nullable: true
                  description: DuckDB CLI the XML import uses (same lookup as the converter); null when none is found
                  properties:
                    path:
                      type: string
                    version:
                      type: string
                      nullable: true
                node_version:
                  type: string
                uptime_seconds:
                  type: integer
                health:
                  type: string
                  enum: [healthy, degraded, unhealthy]
                database:
                  type: object
                  properties:
                    connected:
                      type: boolean
                    path:
                      type: string
                    size_mb:
                      type: number

    InfoResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                solution:
                  type: object
                  properties:
                    file_count:
                      type: integer
                    files:
                      type: array
                      items:
                        type: object
                        properties:
                          File_Name:
                            type: string
                          File_FullName:
                            type: string
                          FileMaker_Version:
                            type: string
                          Has_DDR_INFO:
                            type: boolean
                          Import_Timestamp:
                            type: string
                            format: date-time
                    object_statistics:
                      type: object
                      additionalProperties:
                        type: integer
                    link_statistics:
                      type: object

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - OBJECT_NOT_FOUND
                - TEMPLATE_NOT_FOUND
                - DATABASE_ERROR
                - TEMPLATE_ERROR
                - FILE_NOT_FOUND
                - IMPORT_ERROR
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          type: object
          properties:
            request_id:
              type: string
            timestamp:
              type: string
              format: date-time

    Favorites:
      type: object
      required:
        - items
        - missing
      properties:
        items:
          type: array
          description: Available favorites in the order they were added
          items:
            type: object
            required:
              - id
            properties:
              id:
                type: string
                example: unused_layout
              added_at:
                type: string
                format: date-time
                nullable: true
                example: '2026-11-01T10:12:00Z'
        missing:
          type: array
          description: >-
            Stored ids that no longer resolve (dashboard: unknown to the
            discovery or no longer in a favoritable area; test: unknown)
          items:
            type: string

    TemplateCleanupItem:
      type: object
      required: [case, from, to, target]
      properties:
        case:
          type: string
          enum: [a1, a2, a3, b1, b2, b3, f1, f2, f3, f4, f5, t1, t2, t3, t4]
          description: >-
            Dashboards — a1 old copy in dashboards/ · a2 old copy at a shipped
            path in dashboards-custom/ · a3 emptied old folder · b1 own bundle
            or folder of own bundles in dashboards/ · b2 other foreign folder
            in dashboards/ · b3 own bundle whose id or target already exists in
            dashboards-custom/ · f1 old copy of a shipped query at an old
            location · f2 own query at an old location · f3 own query whose id
            or target already exists in dashboards-custom/ · f4 other rest at
            an old location · f5 foreign .sql file in dashboards/.
            Tests — t1 shipped test away from its path · t2 own test or folder
            of own tests in tests/ · t3 own test whose id or target already
            exists in tests-custom/ · t4 folder without a test
        from:
          type: string
          example: dashboards-custom/static-code-analysis/unused_code/unused_layout
        to:
          type: string
          example: dashboards-removed/2026-11-02T14-30-05Z/dashboards-custom/static-code-analysis/unused_code/unused_layout
        target:
          type: string
          enum: [custom, removed]
        id:
          type: string
          nullable: true
          description: Id when `from` is a bundle, a query file or a test; null for folders
        ids:
          type: array
          description: Ids moved with this entry
          items:
            type: string
        modified:
          type: boolean
          description: a2, f1 — the copy differs from the shipped one (f1 ignores `-- @category:` lines)
        conflict:
          type: boolean
          description: b3, f3, t3 — own content that could not move to the user area
        note:
          type: string
          nullable: true
          enum: [report_template, null]
          description: 'f2 from `sql/`: a former report template, now reachable via /api/query'
        canonical:
          type: string
          nullable: true
          description: f1 — the shipped file the copy was compared with (relative to rest-api/templates/)
          example: dashboards/layouts/tooltip_inventory.sql
    TemplateCleanupSummary:
      type: object
      properties:
        total:
          type: integer
        to_custom:
          type: integer
        to_removed:
          type: integer
        modified:
          type: integer
        conflicts:
          type: integer
    TemplateCleanupPreview:
      type: object
      required: [inventory, stamp, items, summary]
      properties:
        inventory:
          type: boolean
          description: false when no usable inventory.json exists (nothing classified)
        stamp:
          type: string
          description: Run folder name a cleanup started now would use
          example: 2026-11-02T14-30-05Z
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateCleanupItem'
        summary:
          $ref: '#/components/schemas/TemplateCleanupSummary'
        running:
          type: boolean
          description: A run of this cleanup is active right now
    TemplateCleanupReport:
      type: object
      required: [inventory, stamp, moved, skipped, errors, summary]
      properties:
        inventory:
          type: boolean
        stamp:
          type: string
        moved:
          type: array
          items:
            $ref: '#/components/schemas/TemplateCleanupItem'
        skipped:
          type: array
          description: Entries not moved because of an error
          items:
            $ref: '#/components/schemas/TemplateCleanupItem'
        errors:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              message:
                type: string
        summary:
          $ref: '#/components/schemas/TemplateCleanupSummary'
        removed_dir:
          type: string
          nullable: true
          description: Run folder with cleanup.json, relative to rest-api/templates/
          example: dashboards-removed/2026-11-02T14-30-05Z

  responses:
    NotFound:
      description: Object not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: OBJECT_NOT_FOUND
              message: Object with UUID 'ABC-123' not found
              details:
                uuid: ABC-123

    TemplateNotFound:
      description: Template not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: TEMPLATE_NOT_FOUND
              message: Template 'unknown_template' not found
              details:
                template: unknown_template

    ValidationError:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Invalid parameter 'type'
              details:
                field: type
                value: InvalidType
